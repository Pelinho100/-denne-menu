<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Týždenné denné menu</title>
<style>
:root{--bg:#f3f3f3;--card:#fff;--line:#d8d8d8;--text:#111;--muted:#666;--soft:#ececec;--danger:#a40018}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
button,input,select{font:inherit}
button{border:0;border-radius:14px;padding:11px 14px;background:#111;color:#fff}
button.gray{background:#e8e8e8;color:#111}
button.red{background:#fff;color:var(--danger);border:1px solid #e8b9c1}
button.small{padding:7px 10px;font-size:12px;border-radius:10px}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:12px}
.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.head h1{margin:0;font-size:20px}
.toolbar,.tabs{display:flex;gap:8px;flex-wrap:wrap}
.wrap{max-width:1100px;margin:auto;padding:12px}
.tabs{margin-bottom:12px}
.tabs button{background:#e7e7e7;color:#111}
.tabs button.active{background:#111;color:#fff}
.panel,.preview{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;background:#fff}
.day{border:1px solid #ddd;border-radius:16px;overflow:hidden;margin-bottom:12px;background:#fff}
.dayhead{display:grid;grid-template-columns:1fr 170px;gap:8px;align-items:center;background:#f7f7f7;padding:12px}
.dayhead strong{font-size:18px}
.rows{padding:8px}
.item{border-bottom:1px solid #eee;padding:10px 0}
.item:last-child{border-bottom:0}
.top{display:grid;grid-template-columns:58px 130px 1fr 86px auto;gap:7px;align-items:center}
.details{display:grid;grid-template-columns:1fr 120px;gap:7px;margin-top:7px;padding-left:195px}
.side{display:grid;grid-template-columns:110px 1fr auto;gap:7px;margin-top:7px;padding-left:195px}
.actions{display:flex;gap:6px}
.addline{border-top:1px solid #eee;padding:10px}
.helper{font-size:12px;color:var(--muted);margin:8px 0 0}
.dbform{display:grid;grid-template-columns:1.7fr 1fr;gap:8px}
.dbform2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.dbrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.dbmeta{font-size:12px;color:var(--muted);margin-top:3px}
.preview{margin-top:14px;padding:18px}
.previewTitle{font-size:18px;font-weight:700;margin:0 0 12px}
.printCard{border:1px solid var(--line);border-radius:18px;padding:20px;background:#fff}
.printRestaurant{text-align:center;font-size:18px;font-weight:700;margin:0 0 6px}
.printMain{font-family:Georgia,serif;font-size:28px;font-weight:700;text-align:left;margin:0}
.printRange{font-size:18px;font-weight:700;margin:6px 0 14px}
.pvday{margin-top:14px}
.pvdayHead{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:end;margin-bottom:6px}
.pvdayHead h3{font-size:17px;margin:0;font-weight:800}
.pvdayHead div{text-align:right;font-size:17px;font-weight:800}
.pvline{display:grid;grid-template-columns:30px 1fr 80px;gap:8px;font-size:15px;padding:3px 0;align-items:start}
.pvcode{font-weight:700}
.pvprice{text-align:right;white-space:nowrap}
.pvside{font-size:13px;margin:0 0 3px 38px}
.printFooter{border-top:2px solid #222;margin-top:16px;padding-top:8px;font-size:12px;color:#333}
.hidden{display:none!important}
@media(max-width:760px){
 .settings{grid-template-columns:1fr}
 .dayhead{grid-template-columns:1fr 145px}
 .top{grid-template-columns:55px 1fr}
 .top > :nth-child(3){grid-column:1 / -1}
 .top > :nth-child(4){grid-column:1 / span 1}
 .top > :nth-child(5){grid-column:2 / span 1;justify-self:end}
 .details,.side{padding-left:0}
 .details{grid-template-columns:1fr}
 .side{grid-template-columns:1fr auto}
 .side > :first-child{grid-column:1 / -1}
 .dbform,.dbform2{grid-template-columns:1fr}
 .pvline{grid-template-columns:28px 1fr 66px;font-size:14px}
 .printMain{font-size:24px}
 .printRange{font-size:16px}
}
@media print{
 @page{size:A4;margin:9mm}
 body{background:#fff}
 header,.editor,.previewTitle{display:none!important}
 .wrap{padding:0;max-width:none}
 .preview{margin:0;border:0;padding:0}
 .printCard{border:0;padding:0}
 .printRestaurant{font-size:12pt}
 .printMain{font-size:21pt}
 .printRange{font-size:15pt;margin:3pt 0 10pt}
 .pvday{margin-top:9pt}
 .pvdayHead h3,.pvdayHead div{font-size:11pt}
 .pvline{font-size:9pt}
 .pvside{font-size:7.6pt}
}
</style>
</head>
<body>
<header>
 <div class="head">
  <h1>Týždenné denné menu</h1>
  <div class="toolbar">
   <button id="printBtn">Tlačiť A4</button>
   <button class="gray" id="backupBtn">Záloha</button>
   <button class="gray" id="restoreBtn">Obnoviť</button>
   <input id="restoreFile" type="file" accept="application/json" hidden>
  </div>
 </div>
</header>

<div class="wrap">
 <div class="tabs editor">
  <button id="tabMenu" class="active">Menu</button>
  <button id="tabDb">Databáza jedál</button>
 </div>

 <div class="panel editor" id="menuPanel">
  <div class="settings">
   <div>
    <label>Názov reštaurácie</label>
    <input id="restaurantName" value="Reštaurácia U Mastina">
   </div>
   <div>
    <label>Nadpis</label>
    <input id="menuTitle" value="DENNÉ MENU">
   </div>
  </div>
  <div class="helper">Položky sa zobrazujú a tlačia číslované 1., 2., 3., 4., 5. Pri jedle môžeš meniť názov, cenu, alergény aj prílohu.</div>
  <div id="days"></div>
 </div>

 <div class="panel editor hidden" id="dbPanel">
  <h2 style="margin:0 0 10px">Databáza jedál</h2>
  <div class="dbform">
   <input id="dbName" placeholder="Názov jedla alebo prílohy">
   <select id="dbCategory">
    <option>Hlavné jedlo</option>
    <option>Polievka</option>
    <option>Príloha</option>
   </select>
  </div>
  <div class="dbform2">
   <input id="dbWeight" placeholder="Gramáž napr. 150 g / 0,33 l">
   <input id="dbPrice" placeholder="Cena napr. 8,50">
   <input id="dbAllergens" placeholder="Alergény napr. 1,3,7">
  </div>
  <input id="dbId" type="hidden">
  <div class="toolbar" style="margin:10px 0">
   <button id="saveDb">Pridať do databázy</button>
   <button class="gray" id="clearDb">Vyčistiť</button>
  </div>
  <input id="dbSearch" placeholder="Vyhľadať v databáze...">
  <div id="dbList"></div>
 </div>

 <div class="preview">
  <div class="previewTitle">Náhľad hotového jedálneho lístka</div>
  <div class="printCard">
   <div id="pvRestaurant" class="printRestaurant"></div>
   <h2 id="pvTitle" class="printMain">DENNÉ MENU</h2>
   <div id="pvRange" class="printRange"></div>
   <div id="pvDays"></div>
   <div class="printFooter">Alergény sú uvedené v zátvorke. Zmeny v ponuke vyhradené. Menu je pripravené na čiernobielu tlač A4.</div>
  </div>
 </div>
</div>

<datalist id="dishList"></datalist>
<datalist id="sideList"></datalist>

<script>
const $=id=>document.getElementById(id);
const STORE="dailyMenuV10";
const DAYS=["Pondelok","Utorok","Streda","Štvrtok","Piatok"];
function uid(){return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function monday(){const d=new Date();d.setHours(12,0,0,0);const n=d.getDay()||7;d.setDate(d.getDate()-n+1);return d}
function iso(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${dd}`}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)}
function fmt(s){return parseISO(s).toLocaleDateString("sk-SK",{day:"2-digit",month:"2-digit",year:"numeric"})}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(v){if(!v)return "";return String(v).includes("€")?String(v):`${v} €`}

const seedDb=[
 {id:uid(),category:"Hlavné jedlo",name:"Hovädzí guláš",weight:"150 g",price:"8,50",allergens:"1,3,7"},
 {id:uid(),category:"Hlavné jedlo",name:"Kurací rezeň",weight:"150 g",price:"7,50",allergens:"1,3,7"},
 {id:uid(),category:"Hlavné jedlo",name:"Vyprážaný syr",weight:"120 g",price:"7,50",allergens:"1,3,7"},
 {id:uid(),category:"Hlavné jedlo",name:"Bravčový steak",weight:"150 g",price:"8,20",allergens:"7"},
 {id:uid(),category:"Hlavné jedlo",name:"Kuracie soté na zelenine",weight:"150 g",price:"7,90",allergens:"1"},
 {id:uid(),category:"Hlavné jedlo",name:"Pečené kuracie stehno",weight:"200 g",price:"7,90",allergens:""},
 {id:uid(),category:"Hlavné jedlo",name:"Bravčové výpečky",weight:"150 g",price:"8,20",allergens:"1"},
 {id:uid(),category:"Hlavné jedlo",name:"Grilovaný losos",weight:"150 g",price:"9,80",allergens:"4"},
 {id:uid(),category:"Hlavné jedlo",name:"Kurací perkelt",weight:"150 g",price:"8,10",allergens:"1,7"},
 {id:uid(),category:"Hlavné jedlo",name:"Segedínsky guláš",weight:"150 g",price:"8,30",allergens:"1,7"},
 {id:uid(),category:"Polievka",name:"Slepačí vývar s rezancami",weight:"0,33 l",price:"2,20",allergens:"1,3,9"},
 {id:uid(),category:"Polievka",name:"Cesnaková polievka so syrom",weight:"0,33 l",price:"2,50",allergens:"1,7"},
 {id:uid(),category:"Príloha",name:"Domáca knedľa",weight:"160 g",price:"",allergens:"1,3,7"},
 {id:uid(),category:"Príloha",name:"Zemiaková kaša",weight:"200 g",price:"",allergens:"7"},
 {id:uid(),category:"Príloha",name:"Miešaný šalát",weight:"120 g",price:"",allergens:""},
 {id:uid(),category:"Príloha",name:"Ryža",weight:"150 g",price:"",allergens:""},
 {id:uid(),category:"Príloha",name:"Hranolky",weight:"150 g",price:"",allergens:""},
 {id:uid(),category:"Príloha",name:"Varené zemiaky",weight:"200 g",price:"",allergens:""},
 {id:uid(),category:"Príloha",name:"Dusená ryža",weight:"150 g",price:"",allergens:""},
 {id:uid(),category:"Príloha",name:"Kapustový šalát",weight:"120 g",price:"",allergens:""}
];

const menuSeed=[
 [
  {name:"Hovädzí guláš",side:"Domáca knedľa"},
  {name:"Kurací rezeň",side:"Zemiaková kaša, Miešaný šalát"},
  {name:"Vyprážaný syr",side:"Hranolky, Tatárska omáčka"},
  {name:"Bravčový steak",side:"Ryža"},
  {name:"Kuracie soté na zelenine",side:"Dusená ryža"}
 ],
 [
  {name:"Pečené kuracie stehno",side:"Ryža, Kapustový šalát"},
  {name:"Bravčové výpečky",side:"Varené zemiaky"},
  {name:"Grilovaný losos",side:"Varené zemiaky"},
  {name:"Kurací perkelt",side:"Domáca knedľa"},
  {name:"Segedínsky guláš",side:"Domáca knedľa"}
 ],
 [
  {name:"Kurací rezeň",side:"Hranolky, Miešaný šalát"},
  {name:"Hovädzí guláš",side:"Domáca knedľa"},
  {name:"Vyprážaný syr",side:"Zemiaková kaša"},
  {name:"Kuracie soté na zelenine",side:"Ryža"},
  {name:"Bravčový steak",side:"Varené zemiaky"}
 ],
 [
  {name:"Pečené kuracie stehno",side:"Dusená ryža"},
  {name:"Segedínsky guláš",side:"Domáca knedľa"},
  {name:"Grilovaný losos",side:"Miešaný šalát"},
  {name:"Kurací perkelt",side:"Domáca knedľa"},
  {name:"Bravčové výpečky",side:"Varené zemiaky"}
 ],
 [
  {name:"Hovädzí guláš",side:"Domáca knedľa"},
  {name:"Kurací rezeň",side:"Zemiaková kaša, Kapustový šalát"},
  {name:"Bravčový steak",side:"Ryža"},
  {name:"Vyprážaný syr",side:"Hranolky"},
  {name:"Kuracie soté na zelenine",side:"Dusená ryža"}
 ]
];

function dbByName(name){return state.db.find(x=>x.name.toLowerCase()===name.trim().toLowerCase())}
function makeItem(code,name,side){
 const d=dbByName(name)||{name,category:"Hlavné jedlo",weight:"",price:"",allergens:""};
 return {id:uid(),code,category:d.category,sourceName:d.name,name:d.name,weight:d.weight,price:d.price,allergens:d.allergens,side:side||"",extras:[]};
}
function makeInitialDays(){
 const mon=monday();
 return DAYS.map((day,i)=>{
   const d=new Date(mon);d.setDate(mon.getDate()+i);
   return {day,date:iso(d),items:menuSeed[i].map((m,j)=>makeItem(`${j+1}.`,m.name,m.side))};
 });
}
let state;
try{state=JSON.parse(localStorage.getItem(STORE)||"null")}catch(e){state=null}
if(!state)state={restaurant:"Reštaurácia U Mastina",title:"DENNÉ MENU",db:seedDb,days:makeInitialDays()};
function save(){localStorage.setItem(STORE,JSON.stringify(state))}

function refreshDatalists(){
 const dl=$("dishList");dl.innerHTML="";
 state.db.filter(x=>x.category!=="Príloha").sort((a,b)=>a.name.localeCompare(b.name,"sk")).forEach(d=>{
  const o=document.createElement("option");o.value=d.name;o.label=`${d.category} • ${d.weight||""} • ${d.price||""}`;dl.appendChild(o);
 });
 const sl=$("sideList");sl.innerHTML="";
 state.db.filter(x=>x.category==="Príloha").sort((a,b)=>a.name.localeCompare(b.name,"sk")).forEach(d=>{
  const o=document.createElement("option");o.value=d.name;o.label=d.weight||"";sl.appendChild(o);
 });
}

function normalizeCodes(day){
 day.items.forEach((it,i)=>it.code=`${i+1}.`);
}

function applyDish(item,name){
 const d=state.db.find(x=>x.name.toLowerCase()===name.trim().toLowerCase() && x.category!=="Príloha");
 if(!d)return false;
 item.sourceName=d.name;item.name=d.name;item.category=d.category;item.weight=d.weight;item.price=d.price;item.allergens=d.allergens;
 return true;
}

function renderMenu(){
 refreshDatalists();
 $("restaurantName").value=state.restaurant;$("menuTitle").value=state.title;
 const host=$("days");host.innerHTML="";
 state.days.forEach((day,di)=>{
  normalizeCodes(day);
  const card=document.createElement("div");card.className="day";
  const head=document.createElement("div");head.className="dayhead";
  const title=document.createElement("strong");title.textContent=day.day;
  const date=document.createElement("input");date.type="date";date.value=day.date;
  date.onchange=()=>{day.date=date.value;save();renderPreview()};
  head.append(title,date);card.appendChild(head);

  const rows=document.createElement("div");rows.className="rows";
  day.items.forEach((it,ii)=>{
   const box=document.createElement("div");box.className="item";
   const top=document.createElement("div");top.className="top";
   const code=document.createElement("input");code.value=it.code||`${ii+1}.`;code.placeholder="1.";
   const cat=document.createElement("select");
   ["Hlavné jedlo","Polievka"].forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;if(it.category===c)o.selected=true;cat.appendChild(o)});
   const dish=document.createElement("input");dish.setAttribute("list","dishList");dish.value=it.sourceName||it.name||"";dish.placeholder="Vyhľadať alebo vybrať jedlo";
   const price=document.createElement("input");price.value=it.price||"";price.placeholder="Cena";
   const actions=document.createElement("div");actions.className="actions";
   const plus=document.createElement("button");plus.className="gray small";plus.textContent="+ príloha";
   const del=document.createElement("button");del.className="red small";del.textContent="×";
   actions.append(plus,del);top.append(code,cat,dish,price,actions);box.appendChild(top);

   const details=document.createElement("div");details.className="details";
   const name=document.createElement("input");name.value=it.name||"";name.placeholder="Názov jedla";
   const weight=document.createElement("input");weight.value=it.weight||"";weight.placeholder="Gramáž";
   details.append(name,weight);box.appendChild(details);

   const sub=document.createElement("div");sub.className="details";
   const allergens=document.createElement("input");allergens.value=it.allergens||"";allergens.placeholder="Alergény";
   const side=document.createElement("input");side.setAttribute("list","sideList");side.value=it.side||"";side.placeholder="Príloha";
   sub.append(allergens,side);box.appendChild(sub);

   dish.onchange=()=>{if(applyDish(it,dish.value)){save();renderMenu();renderPreview()}};
   [[code,"code"],[cat,"category"],[price,"price"],[name,"name"],[weight,"weight"],[allergens,"allergens"],[side,"side"]].forEach(([el,key])=>{
    el.oninput=()=>{it[key]=el.value;save();renderPreview()};
    el.onchange=()=>{it[key]=el.value;save();renderPreview()};
   });
   plus.onclick=()=>{it.extras=it.extras||[];it.extras.push({label:"Príloha",text:""});save();renderMenu();renderPreview()};
   del.onclick=()=>{day.items.splice(ii,1);normalizeCodes(day);save();renderMenu();renderPreview()};

   (it.extras||[]).forEach((ex,ei)=>{
    const r=document.createElement("div");r.className="side";
    const lab=document.createElement("input");lab.value=ex.label||"Príloha";
    const txt=document.createElement("input");txt.setAttribute("list","sideList");txt.value=ex.text||"";txt.placeholder="Ďalšia príloha";
    const dx=document.createElement("button");dx.className="red small";dx.textContent="×";
    lab.oninput=()=>{ex.label=lab.value;save();renderPreview()};
    txt.oninput=()=>{ex.text=txt.value;save();renderPreview()};
    dx.onclick=()=>{it.extras.splice(ei,1);save();renderMenu();renderPreview()};
    r.append(lab,txt,dx);box.appendChild(r);
   });

   rows.appendChild(box);
  });
  card.appendChild(rows);

  const add=document.createElement("div");add.className="addline";
  const btn=document.createElement("button");btn.className="gray";btn.textContent="+ Pridať položku";
  btn.onclick=()=>{day.items.push({id:uid(),code:`${day.items.length+1}.`,category:"Hlavné jedlo",sourceName:"",name:"",weight:"150 g",price:"7,50",allergens:"",side:"",extras:[]});save();renderMenu();renderPreview()};
  const copy=document.createElement("button");copy.className="gray";copy.textContent="Kopírovať z predošlého dňa";
  copy.style.marginLeft="8px";
  copy.onclick=()=>{if(di===0)return;day.items=JSON.parse(JSON.stringify(state.days[di-1].items)).map((x,idx)=>({...x,id:uid(),code:`${idx+1}.`}));save();renderMenu();renderPreview()};
  add.append(btn,copy);card.appendChild(add);
  host.appendChild(card);
 });
 save();
}

function dateRangeText(){
 const first=state.days[0]?.date,last=state.days[state.days.length-1]?.date;
 if(!first||!last)return "";
 return `${fmt(first)} - ${fmt(last)}`;
}

function renderPreview(){
 $("pvTitle").textContent=state.title;
 $("pvRestaurant").textContent=state.restaurant;
 $("pvRange").textContent=dateRangeText();
 const host=$("pvDays");host.innerHTML="";
 state.days.forEach(day=>{
  normalizeCodes(day);
  const sec=document.createElement("div");sec.className="pvday";
  sec.innerHTML=`<div class="pvdayHead"><h3>${esc(day.day)} ${esc(fmt(day.date))}</h3><div>Cena</div></div>`;
  day.items.forEach((it,ii)=>{
   if(!it.name)return;
   const line=document.createElement("div");line.className="pvline";
   line.innerHTML=`<div class="pvcode">${esc(it.code||`${ii+1}.`)}</div><div>${it.category==="Polievka"?`<b>Polievka:</b> `:""}${esc(it.name)}${it.side?`, ${esc(it.side)}`:""}${it.allergens?` (${esc(it.allergens)})`:""}</div><div class="pvprice">${esc(money(it.price))}</div>`;
   sec.appendChild(line);
   (it.extras||[]).forEach(ex=>{if(ex.text){const x=document.createElement("div");x.className="pvside";x.innerHTML=`<b>${esc(ex.label)}:</b> ${esc(ex.text)}`;sec.appendChild(x)}});
  });
  host.appendChild(sec);
 });
}

function renderDb(){
 const q=$("dbSearch").value.toLowerCase(),host=$("dbList");host.innerHTML="";
 state.db.filter(d=>d.name.toLowerCase().includes(q)||d.category.toLowerCase().includes(q)).sort((a,b)=>a.category.localeCompare(b.category,"sk")||a.name.localeCompare(b.name,"sk")).forEach(d=>{
  const r=document.createElement("div");r.className="dbrow";
  r.innerHTML=`<div><b>${esc(d.name)}</b><div class="dbmeta">${esc(d.category)} • ${esc(d.weight||"")} • ${esc(d.price||"")}${d.price?" €":""} • alergény ${esc(d.allergens||"-")}</div></div>`;
  const t=document.createElement("div");t.className="toolbar";
  const e=document.createElement("button");e.className="gray small";e.textContent="Upraviť";
  const x=document.createElement("button");x.className="red small";x.textContent="Zmazať";
  e.onclick=()=>{$("dbId").value=d.id;$("dbName").value=d.name;$("dbCategory").value=d.category;$("dbWeight").value=d.weight||"";$("dbPrice").value=d.price||"";$("dbAllergens").value=d.allergens||"";$("saveDb").textContent="Uložiť zmeny"};
  x.onclick=()=>{if(confirm("Zmazať položku z databázy?")){state.db=state.db.filter(z=>z.id!==d.id);save();renderDb();renderMenu();renderPreview()}};
  t.append(e,x);r.appendChild(t);host.appendChild(r);
 });
}

function clearDb(){
 $("dbId").value="";$("dbName").value="";$("dbCategory").value="Hlavné jedlo";$("dbWeight").value="";$("dbPrice").value="";$("dbAllergens").value="";$("saveDb").textContent="Pridať do databázy";
}

$("restaurantName").oninput=()=>{state.restaurant=$("restaurantName").value;save();renderPreview()};
$("menuTitle").oninput=()=>{state.title=$("menuTitle").value;save();renderPreview()};
$("tabMenu").onclick=()=>{$("menuPanel").classList.remove("hidden");$("dbPanel").classList.add("hidden");$("tabMenu").classList.add("active");$("tabDb").classList.remove("active")};
$("tabDb").onclick=()=>{$("menuPanel").classList.add("hidden");$("dbPanel").classList.remove("hidden");$("tabDb").classList.add("active");$("tabMenu").classList.remove("active")};
$("saveDb").onclick=()=>{
 const name=$("dbName").value.trim(); if(!name) return alert("Zadaj názov položky.");
 const id=$("dbId").value;
 const d={id:id||uid(),name,category:$("dbCategory").value,weight:$("dbWeight").value.trim(),price:$("dbPrice").value.trim(),allergens:$("dbAllergens").value.trim()};
 if(id) state.db=state.db.map(x=>x.id===id?d:x); else state.db.push(d);
 save(); clearDb(); renderDb(); renderMenu(); renderPreview();
};
$("clearDb").onclick=clearDb;
$("dbSearch").oninput=renderDb;
$("printBtn").onclick=()=>window.print();
$("backupBtn").onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="denne-menu-zaloha.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("restoreBtn").onclick=()=>$("restoreFile").click();
$("restoreFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state=JSON.parse(await f.text());save();renderMenu();renderDb();renderPreview();alert("Záloha obnovená.")}catch(err){alert("Zálohu sa nepodarilo načítať.")}};

renderMenu();renderDb();renderPreview();
</script>
</body>
</html>
