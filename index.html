<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Týždenné denné menu</title>
<style>
:root{--bg:#f2f2f2;--card:#fff;--text:#111;--muted:#666;--line:#d7d7d7;--soft:#ececec;--danger:#a40018}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}
button{border:0;border-radius:10px;padding:10px 13px;background:#111;color:#fff}
button.secondary{background:#e9e9e9;color:#111}
button.danger{background:#fff;color:var(--danger);border:1px solid #e5b8c0}
button.small{padding:6px 9px;font-size:12px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px}
.header{max-width:1240px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.header h1{font-size:20px;margin:0}
.toolbar{display:flex;gap:7px;flex-wrap:wrap}
.wrap{max-width:1240px;margin:auto;padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{background:#e7e7e7;color:#111}
.tabs .active{background:#111;color:#fff}
.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.panel,.preview{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.weeknav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.weektitle{font-weight:700;margin:4px 0 12px}
.daycard{border:1px solid #dedede;border-radius:12px;margin-bottom:12px;overflow:hidden}
.dayhead{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:center;background:#f7f7f7;padding:10px}
.dayname{font-weight:800;font-size:17px}
.dayhead input{padding:7px 8px;border:1px solid #ccc;border-radius:8px;background:#fff;width:100%}
.items{padding:8px}
.item{border-bottom:1px solid #ececec;padding:8px 0}
.item:last-child{border-bottom:0}
.itemrow{display:grid;grid-template-columns:54px 1.7fr 84px 80px 92px auto;gap:6px;align-items:center}
.itemrow input,.itemrow select,.subrow input,.dbform input,.dbform select,.search{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;background:#fff}
.subrow{display:grid;grid-template-columns:92px 1fr auto;gap:6px;align-items:center;margin:6px 0 0 60px}
.itemtools{display:flex;gap:5px}
.itemnote{margin:6px 0 0 60px}
.itemnote input{width:100%;padding:7px;border:1px solid #ccc;border-radius:8px}
.addrow{padding:8px;border-top:1px solid #eee}
.preview{padding:24px;min-height:800px}
.preview h2{margin:0;text-align:left;font-family:Georgia,serif;font-size:26px}
.preview .range{font-weight:700;margin-top:2px}
.preview .restaurant{float:right;font-weight:800;margin-top:-32px}
.pvday{margin-top:13px}
.pvdayhead{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:13px}
.pvline{display:grid;grid-template-columns:28px 1fr 52px;gap:6px;font-size:10.5px;line-height:1.25;padding:1.5px 0}
.pvline .price{text-align:right;white-space:nowrap}
.pvsub{font-size:9px;margin-left:34px;color:#222}
.pvfoot{border-top:1px solid #111;margin-top:12px;padding-top:6px;font-size:8px;line-height:1.25}
.dbform{display:grid;grid-template-columns:2fr 1fr 90px 80px;gap:7px}
.dbrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #eee}
.dbmeta{font-size:12px;color:var(--muted);margin-top:2px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.settings input{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}
@media(max-width:950px){
 .layout{grid-template-columns:1fr}
 .preview{min-height:auto}
 .itemrow{grid-template-columns:48px minmax(190px,1fr) 72px 68px 78px auto;overflow-x:auto}
 .dayhead{grid-template-columns:1fr 130px auto}
}
@media(max-width:650px){
 .wrap{padding:8px}
 .panel,.preview{padding:10px}
 .itemrow{grid-template-columns:46px 1fr;gap:5px}
 .itemrow .weight,.itemrow .price,.itemrow .allergens{grid-column:auto}
 .itemtools{grid-column:1/-1}
 .subrow{margin-left:0;grid-template-columns:86px 1fr auto}
 .itemnote{margin-left:0}
 .dayhead{grid-template-columns:1fr 122px}
 .dayhead .copy{grid-column:1/-1}
 .settings{grid-template-columns:1fr}
}
@media print{
 @page{size:A4;margin:8mm}
 body{background:#fff}
 header,.editor{display:none!important}
 .wrap{padding:0;max-width:none}
 .layout{display:block}
 .preview{border:0;border-radius:0;padding:0;min-height:auto}
 .preview h2{font-size:16pt}
 .pvday{margin-top:7px}
 .pvdayhead{font-size:8.5pt}
 .pvline{font-size:7.4pt;grid-template-columns:19px 1fr 38px}
 .pvsub{font-size:6.7pt;margin-left:24px}
 .pvfoot{font-size:6pt}
}
</style>
</head>
<body>
<header>
 <div class="header">
  <h1>Týždenné denné menu</h1>
  <div class="toolbar">
   <button id="printBtn">Tlačiť A4</button>
   <button class="secondary" id="backupBtn">Záloha</button>
   <button class="secondary" id="restoreBtn">Obnoviť</button>
   <input id="restoreFile" type="file" accept="application/json" hidden>
  </div>
 </div>
</header>

<div class="wrap">
 <div class="tabs editor">
  <button id="tabWeek" class="active">Týždeň</button>
  <button id="tabDb">Databáza jedál</button>
 </div>

 <div class="layout">
  <div class="panel editor">
   <section id="weekPanel">
    <div class="settings">
      <div><label>Názov prevádzky</label><input id="restaurantName" placeholder="Napr. TOBB restaurant"></div>
      <div><label>Nadpis</label><input id="menuTitle" value="DENNÉ MENU"></div>
    </div>
    <div class="weeknav">
      <button class="secondary" id="prevWeek">← Predchádzajúci týždeň</button>
      <button class="secondary" id="todayWeek">Tento týždeň</button>
      <button class="secondary" id="nextWeek">Ďalší týždeň →</button>
    </div>
    <div class="weektitle" id="weekTitle"></div>
    <div id="days"></div>
   </section>

   <section id="dbPanel" hidden>
    <h2 style="margin-top:0">Databáza jedál</h2>
    <div class="dbform">
      <input id="dishName" placeholder="Názov jedla">
      <select id="dishCategory">
        <option>Polievka</option>
        <option>Hlavné jedlo</option>
        <option>Fit</option>
        <option>Business</option>
        <option>Iné</option>
      </select>
      <input id="dishWeight" placeholder="150 g">
      <input id="dishPrice" placeholder="7,50">
    </div>
    <div class="settings" style="margin-top:8px">
      <input id="dishAllergens" placeholder="Alergény 1,3,7">
      <input id="dishDefaultSub" placeholder="Predvolená príloha, napr. ryža">
    </div>
    <input id="dishId" type="hidden">
    <div class="toolbar" style="margin:8px 0 12px">
      <button id="saveDish">Pridať jedlo</button>
      <button id="clearDish" class="secondary">Vyčistiť</button>
    </div>
    <input id="searchDish" class="search" placeholder="Hľadať v databáze...">
    <div id="dishList"></div>
   </section>
  </div>

  <div class="preview">
    <h2 id="pvTitle">DENNÉ MENU:</h2>
    <div id="pvRange" class="range"></div>
    <div id="pvRestaurant" class="restaurant"></div>
    <div id="pvDays"></div>
    <div class="pvfoot">
      Alergény sú uvedené v zátvorke. Menu je pripravené na čiernobielu tlač A4.
    </div>
  </div>
 </div>
</div>

<script>
function uid(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
const $=id=>document.getElementById(id);
const names=["Pondelok","Utorok","Streda","Štvrtok","Piatok"];
const seed=[
 {id:uid(),name:"Slepačí vývar s rezancami",category:"Polievka",weight:"0,33 l",price:"",allergens:"1,3,9",defaultSub:""},
 {id:uid(),name:"Cesnaková polievka",category:"Polievka",weight:"0,33 l",price:"",allergens:"1,7",defaultSub:""},
 {id:uid(),name:"Kurací rezeň, zemiaková kaša, šalát",category:"Hlavné jedlo",weight:"150 g",price:"7,50",allergens:"1,3,7",defaultSub:"zemiaková kaša, šalát"},
 {id:uid(),name:"Hovädzí guláš, domáca knedľa",category:"Hlavné jedlo",weight:"150 g",price:"8,50",allergens:"1,3,7",defaultSub:"domáca knedľa"}
];

let data;
try{ data=JSON.parse(localStorage.getItem("dailyMenuV4")||"null"); }catch(e){ data=null; }
if(!data) data={dishes:seed,weeks:{},settings:{restaurantName:"",title:"DENNÉ MENU"}};

function save(){try{localStorage.setItem("dailyMenuV4",JSON.stringify(data))}catch(e){}}
function iso(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function mondayOfDate(d){const x=new Date(d);const day=x.getDay()||7;x.setDate(x.getDate()-day+1);return x}
function formatShort(d){return d.toLocaleDateString("sk-SK",{day:"2-digit",month:"2-digit",year:"numeric"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function newItem(code){return{id:uid(),code:code||"",sourceId:"",name:"",weight:"",price:"",allergens:"",subs:[]}}
function weekKey(monday){return iso(monday)}
function getWeek(monday){
 const key=weekKey(monday);
 if(!data.weeks[key]){
   data.weeks[key]={days:[]};
   for(let i=0;i<5;i++){
     const d=new Date(monday);d.setDate(monday.getDate()+i);
     data.weeks[key].days.push({date:iso(d),items:[]});
   }
 }
 return data.weeks[key];
}
let currentMonday=mondayOfDate(new Date());

function options(selected){
 return `<option value="">-- vyber jedlo z databázy --</option>`+
 data.dishes.slice().sort((a,b)=>a.name.localeCompare(b.name,"sk")).map(d=>`<option value="${d.id}" ${selected===d.id?'selected':''}>${esc(d.name)}</option>`).join('');
}

function renderWeek(){
 const week=getWeek(currentMonday), end=new Date(currentMonday);end.setDate(end.getDate()+4);
 $("weekTitle").textContent=`${formatShort(currentMonday)} – ${formatShort(end)}`;
 $("restaurantName").value=data.settings.restaurantName||"";
 $("menuTitle").value=data.settings.title||"DENNÉ MENU";
 const host=$("days");host.innerHTML="";
 week.days.forEach((day,di)=>{
   const card=document.createElement("div");card.className="daycard";
   const head=document.createElement("div");head.className="dayhead";
   const title=document.createElement("div");title.className="dayname";title.textContent=names[di];
   const date=document.createElement("input");date.type="date";date.value=day.date;
   date.onchange=()=>{day.date=date.value;save();renderPreview()}
   const copy=document.createElement("button");copy.className="secondary small copy";copy.textContent="Kopírovať z predošlého dňa";
   copy.onclick=()=>{if(di===0)return alert("Pondelok nemá predchádzajúci deň v tomto týždni.");day.items=JSON.parse(JSON.stringify(week.days[di-1].items));day.items.forEach(x=>x.id=uid());save();renderWeek();renderPreview()}
   head.append(title,date,copy);card.appendChild(head);

   const items=document.createElement("div");items.className="items";
   day.items.forEach((it,ii)=>{
      const box=document.createElement("div");box.className="item";
      const row=document.createElement("div");row.className="itemrow";
      const code=document.createElement("input");code.value=it.code||"";code.placeholder="1.";
      const sel=document.createElement("select");sel.innerHTML=options(it.sourceId);
      const weight=document.createElement("input");weight.className="weight";weight.value=it.weight||"";weight.placeholder="g";
      const price=document.createElement("input");price.className="price";price.value=it.price||"";price.placeholder="€";
      const allergens=document.createElement("input");allergens.className="allergens";allergens.value=it.allergens||"";allergens.placeholder="alerg.";
      const tools=document.createElement("div");tools.className="itemtools";
      const sub=document.createElement("button");sub.className="secondary small";sub.textContent="+ príloha";
      const del=document.createElement("button");del.className="danger small";del.textContent="×";
      tools.append(sub,del);
      row.append(code,sel,weight,price,allergens,tools);box.appendChild(row);

      const note=document.createElement("div");note.className="itemnote";
      const name=document.createElement("input");name.value=it.name||"";name.placeholder="Názov jedla – môžeš ľubovoľne prepísať";
      note.appendChild(name);box.appendChild(note);

      sel.onchange=()=>{
        const d=data.dishes.find(x=>x.id===sel.value);
        if(d){
          it.sourceId=d.id;it.name=d.name;it.weight=d.weight;it.price=d.price;it.allergens=d.allergens;
          if(d.defaultSub && !it.subs.length)it.subs.push({id:uid(),label:"Príloha",text:d.defaultSub});
          save();renderWeek();renderPreview();
        }
      };
      [[code,'code'],[weight,'weight'],[price,'price'],[allergens,'allergens'],[name,'name']].forEach(([el,key])=>el.oninput=()=>{it[key]=el.value;save();renderPreview()});
      sub.onclick=()=>{it.subs.push({id:uid(),label:"Príloha",text:""});save();renderWeek();renderPreview()};
      del.onclick=()=>{day.items.splice(ii,1);save();renderWeek();renderPreview()};

      it.subs.forEach((s,si)=>{
        const sr=document.createElement("div");sr.className="subrow";
        const lab=document.createElement("input");lab.value=s.label||"";lab.placeholder="Príloha";
        const txt=document.createElement("input");txt.value=s.text||"";txt.placeholder="napr. ryža / hranolky / šalát";
        const dx=document.createElement("button");dx.className="danger small";dx.textContent="×";
        lab.oninput=()=>{s.label=lab.value;save();renderPreview()};txt.oninput=()=>{s.text=txt.value;save();renderPreview()};
        dx.onclick=()=>{it.subs.splice(si,1);save();renderWeek();renderPreview()};
        sr.append(lab,txt,dx);box.appendChild(sr);
      });
      items.appendChild(box);
   });
   card.appendChild(items);
   const add=document.createElement("div");add.className="addrow";
   const b=document.createElement("button");b.className="secondary";b.textContent="+ Pridať položku";
   b.onclick=()=>{const code=day.items.length<2?(day.items.length===0?"A.":"B."):(day.items.length-1)+'.';day.items.push(newItem(code));save();renderWeek();renderPreview()};
   add.appendChild(b);card.appendChild(add);
   host.appendChild(card);
 });
}

function renderPreview(){
 const week=getWeek(currentMonday), end=new Date(currentMonday);end.setDate(end.getDate()+4);
 $("pvTitle").textContent=(data.settings.title||"DENNÉ MENU")+":";
 $("pvRange").textContent=`${formatShort(currentMonday)} - ${formatShort(end)}`;
 $("pvRestaurant").textContent=data.settings.restaurantName||"";
 const host=$("pvDays");host.innerHTML="";
 week.days.forEach((day,di)=>{
   const sec=document.createElement("div");sec.className="pvday";
   const d=parseISO(day.date);
   sec.innerHTML=`<div class="pvdayhead"><span>${names[di]} ${formatShort(d)}</span><span>Cena</span></div>`;
   day.items.forEach(it=>{
     const p=it.price?(it.price.includes("€")?it.price:it.price+" €"):"";
     const r=document.createElement("div");r.className="pvline";
     r.innerHTML=`<div>${esc(it.code)}</div><div>${esc(it.name)}${it.allergens?` <span>(${esc(it.allergens)})</span>`:""}</div><div class="price">${esc(p)}</div>`;
     sec.appendChild(r);
     it.subs.forEach(s=>{
       if(!s.text && !s.label)return;
       const x=document.createElement("div");x.className="pvsub";x.innerHTML=`<b>${esc(s.label)}:</b> ${esc(s.text)}`;sec.appendChild(x)
     })
   });
   host.appendChild(sec);
 });
}

function renderDishes(){
 const q=$("searchDish").value.toLowerCase(),host=$("dishList");host.innerHTML="";
 data.dishes.filter(d=>d.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,"sk")).forEach(d=>{
   const r=document.createElement("div");r.className="dbrow";
   r.innerHTML=`<div><b>${esc(d.name)}</b><div class="dbmeta">${esc(d.category)} • ${esc(d.weight||"")} • ${esc(d.price||"")} € • alergény ${esc(d.allergens||"-")}${d.defaultSub?` • príloha: ${esc(d.defaultSub)}`:""}</div></div>`;
   const t=document.createElement("div");t.className="toolbar";
   const e=document.createElement("button");e.className="secondary small";e.textContent="Upraviť";
   const x=document.createElement("button");x.className="danger small";x.textContent="Zmazať";
   e.onclick=()=>loadDish(d.id);x.onclick=()=>{if(confirm("Zmazať jedlo z databázy?")){data.dishes=data.dishes.filter(z=>z.id!==d.id);save();renderDishes();renderWeek()}};
   t.append(e,x);r.appendChild(t);host.appendChild(r);
 });
}
function loadDish(id){const d=data.dishes.find(x=>x.id===id);$("dishId").value=d.id;$("dishName").value=d.name;$("dishCategory").value=d.category;$("dishWeight").value=d.weight||"";$("dishPrice").value=d.price||"";$("dishAllergens").value=d.allergens||"";$("dishDefaultSub").value=d.defaultSub||"";$("saveDish").textContent="Uložiť zmeny"}
function clearDish(){["dishId","dishName","dishWeight","dishPrice","dishAllergens","dishDefaultSub"].forEach(id=>$(id).value="");$("dishCategory").value="Polievka";$("saveDish").textContent="Pridať jedlo"}

$("restaurantName").oninput=()=>{data.settings.restaurantName=$("restaurantName").value;save();renderPreview()}
$("menuTitle").oninput=()=>{data.settings.title=$("menuTitle").value;save();renderPreview()}
$("prevWeek").onclick=()=>{currentMonday.setDate(currentMonday.getDate()-7);renderWeek();renderPreview()}
$("nextWeek").onclick=()=>{currentMonday.setDate(currentMonday.getDate()+7);renderWeek();renderPreview()}
$("todayWeek").onclick=()=>{currentMonday=mondayOfDate(new Date());renderWeek();renderPreview()}
$("tabWeek").onclick=()=>{$("weekPanel").hidden=false;$("dbPanel").hidden=true;$("tabWeek").classList.add("active");$("tabDb").classList.remove("active")}
$("tabDb").onclick=()=>{$("weekPanel").hidden=true;$("dbPanel").hidden=false;$("tabDb").classList.add("active");$("tabWeek").classList.remove("active")}
$("saveDish").onclick=()=>{const name=$("dishName").value.trim();if(!name)return alert("Zadaj názov jedla.");const id=$("dishId").value;const d={id:id||uid(),name,category:$("dishCategory").value,weight:$("dishWeight").value.trim(),price:$("dishPrice").value.trim(),allergens:$("dishAllergens").value.trim(),defaultSub:$("dishDefaultSub").value.trim()};if(id)data.dishes=data.dishes.map(x=>x.id===id?d:x);else data.dishes.push(d);save();clearDish();renderDishes();renderWeek()}
$("clearDish").onclick=clearDish;$("searchDish").oninput=renderDishes;$("printBtn").onclick=()=>window.print()
$("backupBtn").onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="denne-menu-zaloha.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("restoreBtn").onclick=()=>$("restoreFile").click()
$("restoreFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{data=JSON.parse(await f.text());save();renderDishes();renderWeek();renderPreview();alert("Záloha obnovená.")}catch(err){alert("Zálohu sa nepodarilo načítať.")}}

renderDishes();renderWeek();renderPreview();
</script>
</body>
</html>
