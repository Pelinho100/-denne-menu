<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reštaurácia U Mastina – obedové menu</title>
<style>
:root{--bg:#f2f2f2;--card:#fff;--line:#d8d8d8;--text:#111;--soft:#ededed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}
button{border:0;border-radius:12px;padding:11px 14px;background:#111;color:#fff}
button.gray{background:#e8e8e8;color:#111}
button.red{background:#fff;color:#9b001a;border:1px solid #e4bcc4}
button.small{padding:7px 9px;font-size:12px}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #ddd;padding:12px}
.header-inner{max-width:1100px;margin:auto}
h1{font-size:22px;margin:0 0 10px}
.toolbar,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}
.wrap{max-width:1100px;margin:auto;padding:12px}
.tabs{margin-bottom:12px}
.tabs button{background:#e8e8e8;color:#111}
.tabs button.active{background:#111;color:#fff}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin-bottom:12px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;color:#666;font-size:13px;font-weight:600;margin-bottom:5px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff}
.help{font-size:13px;color:#666;margin-top:10px}
.day{background:#fff;border:1px solid #ddd;border-radius:16px;overflow:hidden;margin-bottom:14px}
.day-head{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;background:#f7f7f7;padding:12px}
.day-head strong{font-size:21px}
.items{padding:8px 12px}
.item{border-bottom:1px solid #eee;padding:10px 0}
.item:last-child{border-bottom:0}
.item-top{display:grid;grid-template-columns:52px 120px 1fr 85px auto;gap:7px;align-items:center}
.item-sub{display:grid;grid-template-columns:1fr 130px 1fr;gap:7px;margin-top:7px;padding-left:179px}
.extras{margin-top:7px;padding-left:179px}
.extra{display:grid;grid-template-columns:100px 1fr auto;gap:7px;margin-top:6px}
.add-row{padding:10px;border-top:1px solid #eee;display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}

/* A4 preview */
.preview-wrap{margin-top:16px}
.preview-title{font-size:20px;font-weight:800;margin:0 0 10px}
.a4-stage{overflow:auto;background:#dcdcdc;border-radius:16px;padding:10px}
.a4{
  width:794px;
  min-height:1123px;
  margin:0 auto;
  background:#fff;
  color:#111;
  padding:34px 38px 28px;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
  font-family:Georgia,"Times New Roman",serif;
}
.a4-head{text-align:center;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:14px}
.a4-rest{font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.a4-title{font-size:34px;font-weight:800;letter-spacing:.02em;margin:3px 0}
.a4-meta{display:flex;justify-content:space-between;gap:20px;font-family:Arial,sans-serif;font-size:12px;font-weight:700}
.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid #111;border-left:1px solid #111}
.day-box{padding:10px 12px 8px;border-right:1px solid #111;border-bottom:1px solid #111;min-height:265px}
.day-box.friday{grid-column:1/-1;min-height:235px}
.day-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid #111;padding-bottom:4px;margin-bottom:6px}
.day-title b{font-family:Arial,sans-serif;font-size:16px}
.day-title span{font-family:Arial,sans-serif;font-size:11px;font-weight:700}
.section-label{font-family:Arial,sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;margin:4px 0 2px;letter-spacing:.04em}
.menu-line{display:grid;grid-template-columns:18px 1fr 54px;gap:5px;align-items:start;font-size:10.2px;line-height:1.22;padding:1.2px 0}
.menu-line .num{font-weight:700}
.menu-line .price{text-align:right;white-space:nowrap;font-family:Arial,sans-serif;font-size:9.4px;font-weight:700}
.menu-line .all{font-size:9px}
.menu-side{font-size:8.7px;line-height:1.15;margin:0 0 1px 23px;color:#222}
.a4-foot{display:flex;justify-content:space-between;gap:12px;border-top:2px solid #111;margin-top:12px;padding-top:7px;font-family:Arial,sans-serif;font-size:9px}
.a4-foot .left{font-weight:700}

@media(max-width:820px){
 .settings{grid-template-columns:1fr}
 .day-head{grid-template-columns:1fr 130px}
 .item-top{grid-template-columns:48px 1fr}
 .item-top .dish{grid-column:1/-1}
 .item-top .price{grid-column:1/2}
 .item-top .actions{grid-column:2/3;justify-content:flex-end}
 .item-sub,.extras{padding-left:0;grid-template-columns:1fr}
 .extra{grid-template-columns:1fr auto}
 .extra input:first-child{grid-column:1/-1}
 .a4-stage{padding:0;background:transparent}
 .a4{transform-origin:top left}
}
@media print{
 @page{size:A4 portrait;margin:0}
 body{background:#fff}
 header,.editor,.preview-title{display:none!important}
 .wrap{max-width:none;padding:0;margin:0}
 .preview-wrap{margin:0}
 .a4-stage{padding:0;background:#fff;overflow:visible}
 .a4{width:210mm;min-height:297mm;margin:0;padding:9mm 10mm 8mm;box-shadow:none}
 .a4-rest{font-size:13pt}
 .a4-title{font-size:24pt}
 .a4-meta{font-size:8.5pt}
 .day-box{min-height:67mm;padding:2.8mm 3mm 2mm}
 .day-box.friday{min-height:58mm}
 .day-title b{font-size:10.5pt}
 .day-title span{font-size:7.5pt}
 .section-label{font-size:6.6pt}
 .menu-line{font-size:6.6pt;line-height:1.17;grid-template-columns:4mm 1fr 14mm;gap:1.2mm;padding:.35mm 0}
 .menu-line .price{font-size:6.2pt}
 .menu-side{font-size:5.8pt;margin-left:5.2mm}
 .a4-foot{font-size:6.2pt}
}
</style>
</head>
<body>
<header>
 <div class="header-inner">
  <h1>Týždenné denné menu</h1>
  <div class="toolbar">
   <button onclick="window.print()">Tlačiť A4</button>
   <button class="gray" id="backupBtn">Záloha</button>
   <button class="gray" id="restoreBtn">Obnoviť</button>
   <input id="restoreFile" type="file" accept=".json,application/json" hidden>
  </div>
 </div>
</header>

<div class="wrap">
 <div class="tabs editor">
  <button id="tabMenu" class="active">Menu</button>
  <button id="tabDb">Databáza jedál</button>
 </div>

 <div id="menuPanel" class="editor">
  <div class="card">
   <div class="settings">
    <div><label>Názov reštaurácie</label><input id="restaurant"></div>
    <div><label>Telefón na objednávky</label><input id="phone"></div>
    <div><label>Nadpis</label><input id="title"></div>
    <div><label>Dátum pondelka</label><input id="mondayDate" type="date"></div>
   </div>
   <div class="help"><b>Nastavíš iba pondelok.</b> Utorok až piatok sa dopočítajú automaticky. Menu je upravené tak, aby sa celý týždeň vytlačil na jednu A4.</div>
  </div>
  <div id="days"></div>
 </div>

 <div id="dbPanel" class="card editor hidden">
  <h2>Databáza jedál</h2>
  <div class="settings">
   <div><label>Názov</label><input id="dbName"></div>
   <div><label>Typ</label>
    <select id="dbCategory"><option>Hlavné jedlo</option><option>Polievka</option><option>Príloha</option></select>
   </div>
   <div><label>Gramáž</label><input id="dbWeight"></div>
   <div><label>Cena</label><input id="dbPrice"></div>
   <div><label>Alergény</label><input id="dbAllergens"></div>
  </div>
  <input id="dbId" type="hidden">
  <div class="toolbar" style="margin:10px 0"><button id="dbSave">Pridať</button><button id="dbClear" class="gray">Vyčistiť</button></div>
  <label>Hľadať v databáze</label><input id="dbSearch" placeholder="Začni písať názov...">
  <div id="dbList"></div>
 </div>

 <div class="preview-wrap">
  <div class="preview-title">Náhľad jednej A4</div>
  <div class="a4-stage">
   <div class="a4" id="a4">
    <div class="a4-head">
     <div class="a4-rest" id="pvRestaurant"></div>
     <div class="a4-title" id="pvTitle"></div>
     <div class="a4-meta">
      <div id="pvRange"></div>
      <div id="pvPhone"></div>
     </div>
    </div>
    <div class="week-grid" id="pvDays"></div>
    <div class="a4-foot">
     <div class="left">Alergény sú uvedené v zátvorke.</div>
     <div>Zmeny v ponuke vyhradené.</div>
    </div>
   </div>
  </div>
 </div>
</div>

<datalist id="dishList"></datalist>
<datalist id="sideList"></datalist>

<script>
const STORE="dailyMenuV14";
const DAYS=["Pondelok","Utorok","Streda","Štvrtok","Piatok"];
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

function mondayOfCurrentWeek(){
 const d=new Date(); d.setHours(12,0,0,0);
 const n=d.getDay()||7; d.setDate(d.getDate()-n+1); return d;
}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)}
function fmt(s){return parseISO(s).toLocaleDateString("sk-SK",{day:"2-digit",month:"2-digit",year:"numeric"})}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(v){if(!v)return "";return String(v).includes("€")?String(v):`${v} €`}

function seedDb(){
 return [
  {id:uid(),category:"Polievka",name:"Slepačí vývar s rezancami",weight:"0,33 l",price:"2,20",allergens:"1,3,9"},
  {id:uid(),category:"Polievka",name:"Paradajková polievka",weight:"0,33 l",price:"2,20",allergens:"7"},
  {id:uid(),category:"Polievka",name:"Cesnaková polievka",weight:"0,33 l",price:"2,20",allergens:"1,7"},
  {id:uid(),category:"Hlavné jedlo",name:"Kurací rezeň",weight:"150 g",price:"7,90",allergens:"1,3,7"},
  {id:uid(),category:"Hlavné jedlo",name:"Hovädzí guláš",weight:"150 g",price:"8,50",allergens:"1"},
  {id:uid(),category:"Hlavné jedlo",name:"Vyprážaný syr",weight:"120 g",price:"7,50",allergens:"1,3,7"},
  {id:uid(),category:"Hlavné jedlo",name:"Kuracie soté",weight:"150 g",price:"7,90",allergens:"1"},
  {id:uid(),category:"Hlavné jedlo",name:"Bravčový steak",weight:"150 g",price:"8,20",allergens:"7"},
  {id:uid(),category:"Hlavné jedlo",name:"Pečené kuracie stehno",weight:"200 g",price:"7,90",allergens:""},
  {id:uid(),category:"Príloha",name:"Ryža",weight:"150 g",price:"",allergens:""},
  {id:uid(),category:"Príloha",name:"Hranolky",weight:"150 g",price:"",allergens:""},
  {id:uid(),category:"Príloha",name:"Zemiaková kaša",weight:"200 g",price:"",allergens:"7"},
  {id:uid(),category:"Príloha",name:"Domáca knedľa",weight:"160 g",price:"",allergens:"1,3,7"},
  {id:uid(),category:"Príloha",name:"Miešaný šalát",weight:"120 g",price:"",allergens:""}
 ];
}
function itemFrom(db,name,cat,side=""){
 const d=db.find(x=>x.name===name) || {name,category:cat,weight:"",price:"",allergens:""};
 return {id:uid(),category:d.category,sourceName:d.name,name:d.name,weight:d.weight,price:d.price,allergens:d.allergens,side,extras:[]};
}
function freshState(){
 const db=seedDb();
 const mon=mondayOfCurrentWeek();
 const plans=[
  [["Slepačí vývar s rezancami","Polievka",""],["Paradajková polievka","Polievka",""],["Kurací rezeň","Hlavné jedlo","Zemiaková kaša, Miešaný šalát"],["Hovädzí guláš","Hlavné jedlo","Domáca knedľa"],["Vyprážaný syr","Hlavné jedlo","Hranolky"],["Kuracie soté","Hlavné jedlo","Ryža"],["Bravčový steak","Hlavné jedlo","Ryža"],["Pečené kuracie stehno","Hlavné jedlo","Zemiaková kaša"]],
  [["Cesnaková polievka","Polievka",""],["Slepačí vývar s rezancami","Polievka",""],["Pečené kuracie stehno","Hlavné jedlo","Ryža"],["Kurací rezeň","Hlavné jedlo","Hranolky"],["Hovädzí guláš","Hlavné jedlo","Domáca knedľa"],["Bravčový steak","Hlavné jedlo","Zemiaková kaša"],["Kuracie soté","Hlavné jedlo","Ryža"],["Vyprážaný syr","Hlavné jedlo","Hranolky"]],
  [["Slepačí vývar s rezancami","Polievka",""],["Paradajková polievka","Polievka",""],["Kuracie soté","Hlavné jedlo","Ryža"],["Bravčový steak","Hlavné jedlo","Zemiaková kaša"],["Kurací rezeň","Hlavné jedlo","Hranolky"],["Vyprážaný syr","Hlavné jedlo","Zemiaková kaša"],["Hovädzí guláš","Hlavné jedlo","Domáca knedľa"],["Pečené kuracie stehno","Hlavné jedlo","Ryža"]],
  [["Cesnaková polievka","Polievka",""],["Paradajková polievka","Polievka",""],["Bravčový steak","Hlavné jedlo","Ryža"],["Pečené kuracie stehno","Hlavné jedlo","Zemiaková kaša"],["Kuracie soté","Hlavné jedlo","Ryža"],["Hovädzí guláš","Hlavné jedlo","Domáca knedľa"],["Vyprážaný syr","Hlavné jedlo","Hranolky"],["Kurací rezeň","Hlavné jedlo","Zemiaková kaša"]],
  [["Slepačí vývar s rezancami","Polievka",""],["Cesnaková polievka","Polievka",""],["Kurací rezeň","Hlavné jedlo","Zemiaková kaša"],["Pečené kuracie stehno","Hlavné jedlo","Ryža"],["Hovädzí guláš","Hlavné jedlo","Domáca knedľa"],["Vyprážaný syr","Hlavné jedlo","Hranolky"],["Bravčový steak","Hlavné jedlo","Ryža"],["Kuracie soté","Hlavné jedlo","Ryža"]]
 ];
 const days=DAYS.map((name,i)=>{
   const d=new Date(mon);d.setDate(mon.getDate()+i);
   return {name,date:iso(d),items:plans[i].map(p=>itemFrom(db,p[0],p[1],p[2]))};
 });
 return {restaurant:"Reštaurácia U Mastina",phone:"0900 123 456",title:"OBEDOVÉ MENU",db,days};
}
let state;
try{state=JSON.parse(localStorage.getItem(STORE)||"null")}catch(e){state=null}
if(!state || !state.days || state.days.length!==5) state=freshState();
function save(){localStorage.setItem(STORE,JSON.stringify(state))}

function renumber(day){
 let s=0,m=0;
 day.items.forEach(it=>{
  if(it.category==="Polievka"){it.code=String.fromCharCode(65+s)+".";s++}
  else{m++;it.code=m+"."}
 });
}
function refreshLists(){
 $("dishList").innerHTML="";
 state.db.filter(x=>x.category!=="Príloha").forEach(d=>{const o=document.createElement("option");o.value=d.name;$("dishList").appendChild(o)});
 $("sideList").innerHTML="";
 state.db.filter(x=>x.category==="Príloha").forEach(d=>{const o=document.createElement("option");o.value=d.name;$("sideList").appendChild(o)});
}
function applyDish(it,name){
 const d=state.db.find(x=>x.name.toLowerCase()===name.trim().toLowerCase() && x.category!=="Príloha");
 if(!d)return;
 Object.assign(it,{category:d.category,sourceName:d.name,name:d.name,weight:d.weight,price:d.price,allergens:d.allergens});
}
function renderMenu(){
 refreshLists();
 $("restaurant").value=state.restaurant;
 $("phone").value=state.phone;
 $("title").value=state.title;
 $("mondayDate").value=state.days[0].date;
 const host=$("days");host.innerHTML="";
 state.days.forEach((day,di)=>{
  renumber(day);
  const card=document.createElement("div");card.className="day";
  const head=document.createElement("div");head.className="day-head";
  head.innerHTML=`<strong>${day.name}</strong><input type="date" value="${day.date}" readonly>`;
  card.appendChild(head);
  const items=document.createElement("div");items.className="items";
  day.items.forEach((it,ii)=>{
   const box=document.createElement("div");box.className="item";
   box.innerHTML=`
    <div class="item-top">
      <input value="${esc(it.code)}" readonly>
      <select class="cat"><option ${it.category==="Polievka"?"selected":""}>Polievka</option><option ${it.category==="Hlavné jedlo"?"selected":""}>Hlavné jedlo</option></select>
      <input class="dish" list="dishList" value="${esc(it.sourceName||it.name)}" placeholder="Vyhľadať jedlo">
      <input class="price" value="${esc(it.price)}" placeholder="Cena">
      <div class="actions"><button class="gray small addExtra">+ príloha</button><button class="red small del">×</button></div>
    </div>
    <div class="item-sub">
      <input class="name" value="${esc(it.name)}" placeholder="Názov">
      <input class="weight" value="${esc(it.weight)}" placeholder="Gramáž">
      <input class="allergens" value="${esc(it.allergens)}" placeholder="Alergény">
    </div>
    <div class="item-sub">
      <input class="side" list="sideList" value="${esc(it.side)}" placeholder="Príloha">
    </div>
    <div class="extras"></div>`;
   const q=s=>box.querySelector(s);
   q(".dish").onchange=e=>{applyDish(it,e.target.value);save();renderMenu();renderPreview()};
   [[".cat","category"],[".price","price"],[".name","name"],[".weight","weight"],[".allergens","allergens"],[".side","side"]].forEach(([sel,key])=>{
    q(sel).oninput=e=>{it[key]=e.target.value;save();renderPreview()};
    q(sel).onchange=e=>{it[key]=e.target.value;save();renderMenu();renderPreview()};
   });
   q(".del").onclick=()=>{day.items.splice(ii,1);renumber(day);save();renderMenu();renderPreview()};
   q(".addExtra").onclick=()=>{it.extras=it.extras||[];it.extras.push({label:"Príloha",text:""});save();renderMenu();renderPreview()};
   const exhost=q(".extras");
   (it.extras||[]).forEach((ex,ei)=>{
    const r=document.createElement("div");r.className="extra";
    r.innerHTML=`<input value="${esc(ex.label)}"><input list="sideList" value="${esc(ex.text)}" placeholder="Ďalšia príloha"><button class="red small">×</button>`;
    const ins=r.querySelectorAll("input");
    ins[0].oninput=e=>{ex.label=e.target.value;save();renderPreview()};
    ins[1].oninput=e=>{ex.text=e.target.value;save();renderPreview()};
    r.querySelector("button").onclick=()=>{it.extras.splice(ei,1);save();renderMenu();renderPreview()};
    exhost.appendChild(r);
   });
   items.appendChild(box);
  });
  card.appendChild(items);
  const add=document.createElement("div");add.className="add-row";
  const b1=document.createElement("button");b1.className="gray";b1.textContent="+ Polievka";
  b1.onclick=()=>{day.items.push({id:uid(),category:"Polievka",sourceName:"",name:"",weight:"0,33 l",price:"2,20",allergens:"",side:"",extras:[]});renumber(day);save();renderMenu();renderPreview()};
  const b2=document.createElement("button");b2.className="gray";b2.textContent="+ Hlavné jedlo";
  b2.onclick=()=>{day.items.push({id:uid(),category:"Hlavné jedlo",sourceName:"",name:"",weight:"150 g",price:"7,50",allergens:"",side:"",extras:[]});renumber(day);save();renderMenu();renderPreview()};
  const b3=document.createElement("button");b3.className="gray";b3.textContent="Kopírovať predošlý deň";
  b3.onclick=()=>{if(di===0)return;day.items=JSON.parse(JSON.stringify(state.days[di-1].items)).map(x=>({...x,id:uid()}));renumber(day);save();renderMenu();renderPreview()};
  add.append(b1,b2,b3);card.appendChild(add);
  host.appendChild(card);
 });
}
function renderPreview(){
 $("pvRestaurant").textContent=state.restaurant;
 $("pvPhone").textContent=state.phone?`Objednávky: ${state.phone}`:"";
 $("pvTitle").textContent=state.title;
 $("pvRange").textContent=`${fmt(state.days[0].date)} – ${fmt(state.days[4].date)}`;
 const host=$("pvDays");host.innerHTML="";
 state.days.forEach((day,di)=>{
  renumber(day);
  const sec=document.createElement("div");sec.className="day-box"+(di===4?" friday":"");
  sec.innerHTML=`<div class="day-title"><b>${day.name}</b><span>${fmt(day.date)}</span></div>`;
  const soups=day.items.filter(x=>x.category==="Polievka");
  const mains=day.items.filter(x=>x.category!=="Polievka");
  if(soups.length){const l=document.createElement("div");l.className="section-label";l.textContent="Polievky";sec.appendChild(l)}
  soups.forEach(it=>{
   const line=document.createElement("div");line.className="menu-line";
   line.innerHTML=`<div class="num">${esc(it.code)}</div><div>${esc(it.name)}${it.allergens?` <span class="all">(${esc(it.allergens)})</span>`:""}</div><div class="price">${esc(money(it.price))}</div>`;
   sec.appendChild(line);
  });
  if(mains.length){const l=document.createElement("div");l.className="section-label";l.textContent="Hlavné jedlá";sec.appendChild(l)}
  mains.forEach(it=>{
   const line=document.createElement("div");line.className="menu-line";
   line.innerHTML=`<div class="num">${esc(it.code)}</div><div>${esc(it.name)}${it.allergens?` <span class="all">(${esc(it.allergens)})</span>`:""}</div><div class="price">${esc(money(it.price))}</div>`;
   sec.appendChild(line);
   if(it.side){const s=document.createElement("div");s.className="menu-side";s.innerHTML=`<b>Príloha:</b> ${esc(it.side)}`;sec.appendChild(s)}
   (it.extras||[]).forEach(ex=>{if(ex.text){const s=document.createElement("div");s.className="menu-side";s.innerHTML=`<b>${esc(ex.label)}:</b> ${esc(ex.text)}`;sec.appendChild(s)}})
  });
  host.appendChild(sec);
 });
 fitPreview();
}
function fitPreview(){
 if(window.innerWidth>820){$("a4").style.transform="none";$("a4").style.marginBottom="0";return}
 const stage=document.querySelector(".a4-stage");
 const scale=Math.min(1,(stage.clientWidth||window.innerWidth)/794);
 $("a4").style.transform=`scale(${scale})`;
 $("a4").style.marginBottom=`${-(1123*(1-scale))}px`;
}
function renderDb(){
 const q=$("dbSearch").value.toLowerCase(),host=$("dbList");host.innerHTML="";
 state.db.filter(d=>d.name.toLowerCase().includes(q)||d.category.toLowerCase().includes(q)).forEach(d=>{
  const r=document.createElement("div");r.className="item";
  r.innerHTML=`<b>${esc(d.name)}</b><div style="font-size:12px;color:#666">${esc(d.category)} • ${esc(d.weight)} • ${esc(d.price)} ${d.price?"€":""} • alergény ${esc(d.allergens||"-")}</div>`;
  const a=document.createElement("div");a.className="actions";a.style.marginTop="8px";
  const e=document.createElement("button");e.className="gray small";e.textContent="Upraviť";
  const x=document.createElement("button");x.className="red small";x.textContent="Zmazať";
  e.onclick=()=>{$("dbId").value=d.id;$("dbName").value=d.name;$("dbCategory").value=d.category;$("dbWeight").value=d.weight;$("dbPrice").value=d.price;$("dbAllergens").value=d.allergens;$("dbSave").textContent="Uložiť zmeny"};
  x.onclick=()=>{state.db=state.db.filter(z=>z.id!==d.id);save();renderDb();renderMenu()};
  a.append(e,x);r.appendChild(a);host.appendChild(r);
 });
}
function clearDb(){["dbId","dbName","dbWeight","dbPrice","dbAllergens"].forEach(id=>$(id).value="");$("dbCategory").value="Hlavné jedlo";$("dbSave").textContent="Pridať"}

$("restaurant").oninput=e=>{state.restaurant=e.target.value;save();renderPreview()};
$("phone").oninput=e=>{state.phone=e.target.value;save();renderPreview()};
$("title").oninput=e=>{state.title=e.target.value;save();renderPreview()};
$("mondayDate").onchange=e=>{
 const base=parseISO(e.target.value);
 state.days.forEach((day,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);day.date=iso(d)});
 save();renderMenu();renderPreview();
};
$("tabMenu").onclick=()=>{$("menuPanel").classList.remove("hidden");$("dbPanel").classList.add("hidden");$("tabMenu").classList.add("active");$("tabDb").classList.remove("active")};
$("tabDb").onclick=()=>{$("menuPanel").classList.add("hidden");$("dbPanel").classList.remove("hidden");$("tabDb").classList.add("active");$("tabMenu").classList.remove("active");renderDb()};
$("dbSave").onclick=()=>{
 const name=$("dbName").value.trim();if(!name)return alert("Zadaj názov.");
 const d={id:$("dbId").value||uid(),name,category:$("dbCategory").value,weight:$("dbWeight").value,price:$("dbPrice").value,allergens:$("dbAllergens").value};
 if($("dbId").value)state.db=state.db.map(x=>x.id===d.id?d:x);else state.db.push(d);
 save();clearDb();renderDb();renderMenu();
};
$("dbClear").onclick=clearDb;$("dbSearch").oninput=renderDb;
$("backupBtn").onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="menu-zaloha.json";a.click()};
$("restoreBtn").onclick=()=>$("restoreFile").click();
$("restoreFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state=JSON.parse(await f.text());save();renderMenu();renderDb();renderPreview()}catch(err){alert("Chybná záloha.")}};
window.addEventListener("resize",fitPreview);

renderMenu();renderDb();renderPreview();
</script>
</body>
</html>
